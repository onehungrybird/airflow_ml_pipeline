version: '3'
services:
  airflow:
    image: apache/airflow:2.6.3
    container_name: airflow
    restart: always
    environment:
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    ports:
      - "8080:8080"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./scripts:/opt/airflow/scripts
      - ./data:/opt/airflow/data
      - ./models:/opt/airflow/models  # ✅ Ensure models directory is mounted
      - ./requirements.txt:/opt/airflow/requirements.txt  # ✅ Ensure requirements file is accessible
    command: bash -c "pip install -r /opt/airflow/requirements.txt && airflow standalone"
